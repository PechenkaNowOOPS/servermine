book:
  name: "Книга управления городом"
  lore:
    - "ПКМ — открыть управление городом."
visual:
  # Source images contain baked demo names/numbers; use for admin preview only.
  use-pixel-backgrounds: false
storage:
  sqlite-file: "cities.db"
  busy-timeout-ms: 5000
protection:
  # Protected rectangles use chunk coordinates. Each entry requires a world UUID and inclusive bounds.
  system-zones: []
territory:
  # Preview price, not an active purchase policy.
  chunk-price: 750
progression:
  # Promotion price and requirements are server balance settings. Price 0 makes this transition free.
  settlement-to-village:
    enabled: true
    price: 0
    minimum-residents: 1
    minimum-chunks: 4
