name: ServerMineCities
version: ${version}
main: ru.servermine.cities.plugin.ServerMineCitiesPlugin
api-version: '26.2'
authors: [ServerMine]
description: Модульная основа Cities и книга управления городом.
depend: [ServerMineEconomy]
commands:
  smcities:
    description: Административная диагностика и предпросмотр GUI
    usage: /smcities <status|givebook|open|preview> [player] [menu]
    permission: servermine.cities.admin
permissions:
  servermine.cities.admin:
    default: op
