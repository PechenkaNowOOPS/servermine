# GradostroyGUI MVP
# Игроки не используют команды. Они открывают интерфейс ПКМ по Книге управления городом.

book:
  name: "Книга управления городом"
  lore:
    - "Открывает управление вашим городом."
    - "ПКМ — открыть книгу."

# Визуальный слой берётся из ресурспака GradostroyGUI-ResourcePack.zip.
# Если ресурспака нет, меню остаётся рабочим за счёт обычных предметов-кнопок.
visual:
  use-pixel-backgrounds: true

# Пока это GUI-прототип, стоимость покупки чанка фиксированная.
territory:
  chunk-price: 750
