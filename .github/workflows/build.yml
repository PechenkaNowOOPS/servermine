name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: ./gradlew --no-daemon projects clean build
      - uses: actions/upload-artifact@v4
        with:
          name: servermine
          path: |
            economy/economy-plugin/build/libs/ServerMineEconomy-*.jar
            cities/cities-plugin/build/libs/ServerMineCities-*.jar
            build/distributions/ServerMine-ResourcePack.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
